<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>CycleLog</title>
<link rel="stylesheet" href="src/ui/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF5F8">
</head>
<body>
<main id="lock" class="screen">
  <h1>CycleLog</h1>
  <p id="lock-prompt">Enter your passphrase.</p>
  <input id="passphrase" type="password" autocomplete="current-password"
         autocapitalize="off" spellcheck="false" inputmode="text">
  <button id="unlock" type="button">Unlock</button>
  <button id="faceid" type="button" hidden>Use Face ID</button>
  <p id="lock-error" role="alert"></p>
</main>

<main id="setup" class="screen" hidden>
  <h1>CycleLog</h1>
  <p>Set a passphrase. It never leaves this phone, and it cannot be recovered —
     if you forget it, the data is gone.</p>
  <input id="setup-passphrase" type="password" autocomplete="new-password"
         autocapitalize="off" spellcheck="false">
  <input id="setup-confirm" type="password" autocomplete="new-password"
         autocapitalize="off" spellcheck="false">

  <p>Optional: import your history.</p>
  <label for="clue-file">Clue export (measurements.json)</label>
  <input id="clue-file" type="file" accept=".json,application/json">
  <label for="legacy-file">Earlier log (.txt)</label>
  <input id="legacy-file" type="file" accept=".txt,text/plain">

  <button id="create" type="button">Create my vault</button>
  <p id="setup-progress" role="status"></p>
  <p id="setup-error" role="alert"></p>
</main>

<main id="app" class="screen" hidden>
  <p id="import-notice" role="status"></p>
  <div id="summary"></div>

  <section class="card calendar">
    <div class="cal-head">
      <button id="cal-prev" type="button" aria-label="Previous month">&lsaquo;</button>
      <h3 id="cal-label"></h3>
      <button id="cal-next" type="button" aria-label="Next month">&rsaquo;</button>
    </div>
    <div id="calendar"></div>
  </section>

  <div id="day-detail"></div>

  <button id="lock-now" type="button">Lock</button>
</main>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
